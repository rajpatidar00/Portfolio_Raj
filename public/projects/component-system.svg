  <rect x="286" y="134" width="226" height="310" rx="8" fill="#161F30" stroke="#1F2937" />
  <text x="302" y="160" font-family="system-ui, sans-serif" font-size="12" fill="#F3F4F6" font-weight="600">Form Controls &amp; Inputs</text>
  
  <text x="302" y="188" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">EMAIL ADDRESS</text>
  <rect x="302" y="196" width="194" height="32" rx="6" fill="#0F172A" stroke="#3B82F6" />
  <text x="314" y="216" font-family="system-ui, sans-serif" font-size="10" fill="#F3F4F6">developer@company.com</text>

  <text x="302" y="248" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">ROLE SELECT</text>
  <rect x="302" y="256" width="194" height="32" rx="6" fill="#0F172A" stroke="#374151" />
  <text x="314" y="276" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">Frontend Engineer ▾</text>

  <text x="302" y="308" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">TOGGLE SWITCHES</text>
  
  <!-- Switch 1 -->
  <rect x="302" y="324" width="36" height="20" rx="10" fill="#2563EB" />
  <circle cx="326" cy="334" r="8" fill="#FFFFFF" />
  <text x="348" y="338" font-family="system-ui, sans-serif" font-size="10" fill="#E5E7EB">Dark Theme</text>

  <!-- Switch 2 -->
  <rect x="302" y="356" width="36" height="20" rx="10" fill="#2563EB" />
  <circle cx="326" cy="366" r="8" fill="#FFFFFF" />
  <text x="348" y="370" font-family="system-ui, sans-serif" font-size="10" fill="#E5E7EB">Strict Typecheck</text>

  <!-- Switch 3 -->
  <rect x="302" y="388" width="36" height="20" rx="10" fill="#374151" />
  <circle cx="312" cy="398" r="8" fill="#FFFFFF" />
  <text x="348" y="402" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">Sound FX</text>

  <!-- Component Card 3: Code Snippet Card -->
  <rect x="528" y="134" width="226" height="310" rx="8" fill="#0F172A" stroke="#1F2937" />
  <rect x="528" y="134" width="226" height="30" rx="8 8 0 0" fill="#1E293B" />
  <text x="542" y="154" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">Button.tsx</text>
  <rect x="710" y="142" width="30" height="14" rx="3" fill="#374151" />
  <text x="716" y="152" font-family="system-ui, sans-serif" font-size="8" fill="#D1D5DB">TSX</text>

  <text x="542" y="184" font-family="monospace" font-size="10" fill="#60A5FA">interface</text>
  <text x="600" y="184" font-family="monospace" font-size="10" fill="#FBBF24">ButtonProps</text>
  <text x="670" y="184" font-family="monospace" font-size="10" fill="#F3F4F6">{</text>
  
  <text x="552" y="204" font-family="monospace" font-size="9" fill="#E5E7EB">variant?:</text>
  <text x="604" y="204" font-family="monospace" font-size="9" fill="#34D399">'default'</text>
  <text x="654" y="204" font-family="monospace" font-size="9" fill="#9CA3AF">|</text>
  <text x="562" y="220" font-family="monospace" font-size="9" fill="#34D399">'outline'</text>
  <text x="612" y="220" font-family="monospace" font-size="9" fill="#9CA3AF">|</text>
  <text x="622" y="220" font-family="monospace" font-size="9" fill="#34D399">'ghost'</text>

  <text x="552" y="244" font-family="monospace" font-size="9" fill="#E5E7EB">size?:</text>
  <text x="590" y="244" font-family="monospace" font-size="9" fill="#34D399">'sm'</text>
  <text x="616" y="244" font-family="monospace" font-size="9" fill="#9CA3AF">|</text>
  <text x="626" y="244" font-family="monospace" font-size="9" fill="#34D399">'lg'</text>

  <text x="552" y="268" font-family="monospace" font-size="9" fill="#E5E7EB">isLoading?:</text>
  <text x="626" y="268" font-family="monospace" font-size="9" fill="#60A5FA">boolean</text>

  <text x="542" y="292" font-family="monospace" font-size="10" fill="#F3F4F6">}</text>

  <rect x="542" y="320" width="198" height="100" rx="6" fill="#161F30" stroke="#1F2937" />
  <text x="554" y="344" font-family="system-ui, sans-serif" font-size="10" fill="#9CA3AF">ACCESSIBILITY AUDIT</text>
  <text x="554" y="368" font-family="system-ui, sans-serif" font-size="16" fill="#34D399" font-weight="700">100 / 100</text>
  <text x="554" y="388" font-family="system-ui, sans-serif" font-size="9" fill="#9CA3AF">WCAG 2.1 AA Compliant</text>
  <text x="554" y="404" font-family="system-ui, sans-serif" font-size="9" fill="#60A5FA">Keyboard navigable</text>
