<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" rx="16" fill="#0D1117" />
  
  <defs>
    <pattern id="grid-events" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#21262D" stroke-width="0.8" opacity="0.5" />
    </pattern>
    <linearGradient id="event-glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="16" fill="url(#grid-events)" />

  <!-- App Header / Window Bar -->
  <rect x="24" y="24" width="752" height="452" rx="12" fill="#161B22" stroke="#30363D" stroke-width="1.5" />
  
  <!-- Window Controls -->
  <circle cx="50" cy="46" r="5" fill="#EF4444" opacity="0.8"/>
  <circle cx="66" cy="46" r="5" fill="#F59E0B" opacity="0.8"/>
  <circle cx="82" cy="46" r="5" fill="#10B981" opacity="0.8"/>
  
  <rect x="120" y="38" width="200" height="16" rx="4" fill="#21262D" />
  <text x="130" y="50" font-family="system-ui, sans-serif" font-size="10" fill="#8B949E">kalingavriti.org / events-hub</text>
  
  <!-- Top Nav Bar inside App -->
  <line x1="25" y1="68" x2="775" y2="68" stroke="#30363D" stroke-width="1" />
  <text x="44" y="96" font-family="system-ui, sans-serif" font-size="15" fill="#F0F6FC" font-weight="700">KV Opportunities &amp; Events</text>
  
  <!-- Search & Filter Controls -->
  <rect x="44" y="116" width="310" height="34" rx="6" fill="#0D1117" stroke="#30363D" />
  <text x="60" y="138" font-family="system-ui, sans-serif" font-size="11" fill="#8B949E">🔍 Search hackathons, tech talks, workshops...</text>
  
  <rect x="368" y="116" width="90" height="34" rx="6" fill="#21262D" stroke="#30363D" />
  <text x="382" y="138" font-family="system-ui, sans-serif" font-size="11" fill="#C9D1D9">⚡ Category ▾</text>

  <rect x="468" y="116" width="90" height="34" rx="6" fill="#21262D" stroke="#30363D" />
  <text x="482" y="138" font-family="system-ui, sans-serif" font-size="11" fill="#C9D1D9">📅 Calendar ▾</text>

  <rect x="568" y="116" width="90" height="34" rx="6" fill="#21262D" stroke="#30363D" />
  <text x="586" y="138" font-family="system-ui, sans-serif" font-size="11" fill="#C9D1D9">📌 Filter ▾</text>

  <rect x="668" y="116" width="108" height="34" rx="6" fill="#238636" />
  <text x="686" y="138" font-family="system-ui, sans-serif" font-size="11" fill="#FFFFFF" font-weight="600">+ Register</text>

  <!-- Cards Grid (3 cards) -->
  <!-- Card 1 -->
  <rect x="44" y="168" width="226" height="240" rx="8" fill="#0D1117" stroke="#30363D" />
  <rect x="44" y="168" width="226" height="80" rx="8 8 0 0" fill="#1F2937" />
  <rect x="56" y="180" width="70" height="18" rx="4" fill="#6366F1" fill-opacity="0.2" stroke="#6366F1" stroke-width="0.5" />
  <text x="64" y="193" font-family="system-ui, sans-serif" font-size="9" fill="#A5B4FC" font-weight="600">HACKATHON</text>
  <text x="56" y="272" font-family="system-ui, sans-serif" font-size="13" fill="#F0F6FC" font-weight="600">FullStack Buildathon 2025</text>
  <text x="56" y="292" font-family="system-ui, sans-serif" font-size="10" fill="#8B949E">Build next-gen web apps using React, Next.js &amp; APIs.</text>
  <line x1="56" y1="350" x2="258" y2="350" stroke="#21262D" stroke-width="1" />
  <text x="56" y="374" font-family="system-ui, sans-serif" font-size="10" fill="#7EE787">● 140 Registered</text>
  <text x="180" y="374" font-family="system-ui, sans-serif" font-size="10" fill="#8B949E">Oct 12-14</text>
  <rect x="56" y="388" width="202" height="12" rx="6" fill="#21262D" />
  <rect x="56" y="388" width="140" height="12" rx="6" fill="#238636" />

  <!-- Card 2 -->
  <rect x="286" y="168" width="226" height="240" rx="8" fill="#0D1117" stroke="#30363D" />
  <rect x="286" y="168" width="226" height="80" rx="8 8 0 0" fill="#1E293B" />
  <rect x="298" y="180" width="70" height="18" rx="4" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6" stroke-width="0.5" />
  <text x="306" y="193" font-family="system-ui, sans-serif" font-size="9" fill="#93C5FD" font-weight="600">WORKSHOP</text>
  <text x="298" y="272" font-family="system-ui, sans-serif" font-size="13" fill="#F0F6FC" font-weight="600">Next.js 15 &amp; React 19 Summit</text>
  <text x="298" y="292" font-family="system-ui, sans-serif" font-size="10" fill="#8B949E">Deep dive into Server Actions, streaming, &amp; JWT auth.</text>
  <line x1="298" y1="350" x2="500" y2="350" stroke="#21262D" stroke-width="1" />
  <text x="298" y="374" font-family="system-ui, sans-serif" font-size="10" fill="#58A6FF">● Live Interactive</text>
  <text x="420" y="374" font-family="system-ui, sans-serif" font-size="10" fill="#8B949E">Nov 04</text>
  <rect x="298" y="388" width="202" height="12" rx="6" fill="#21262D" />
  <rect x="298" y="388" width="180" height="12" rx="6" fill="#1F6FEB" />

  <!-- Card 3 -->
  <rect x="528" y="168" width="226" height="240" rx="8" fill="#0D1117" stroke="#30363D" />
  <rect x="528" y="168" width="226" height="80" rx="8 8 0 0" fill="#182234" />
  <rect x="540" y="180" width="76" height="18" rx="4" fill="#10B981" fill-opacity="0.2" stroke="#10B981" stroke-width="0.5" />
  <text x="548" y="193" font-family="system-ui, sans-serif" font-size="9" fill="#6EE7B7" font-weight="600">TECH TALK</text>
  <text x="540" y="272" font-family="system-ui, sans-serif" font-size="13" fill="#F0F6FC" font-weight="600">Frontend Performance &amp; UI</text>
  <text x="540" y="292" font-family="system-ui, sans-serif" font-size="10" fill="#8B949E">Optimizing Core Web Vitals, re-renders, and bundles.</text>
  <line x1="540" y1="350" x2="742" y2="350" stroke="#21262D" stroke-width="1" />
  <text x="540" y="374" font-family="system-ui, sans-serif" font-size="10" fill="#D29922">● Limited Seats</text>
  <text x="660" y="374" font-family="system-ui, sans-serif" font-size="10" fill="#8B949E">Nov 18</text>
  <rect x="540" y="388" width="202" height="12" rx="6" fill="#21262D" />
  <rect x="540" y="388" width="90" height="12" rx="6" fill="#D29922" />

  <!-- Bottom Pagination Bar -->
  <rect x="44" y="424" width="728" height="36" rx="6" fill="#161B22" stroke="#30363D" />
  <text x="64" y="446" font-family="system-ui, sans-serif" font-size="11" fill="#8B949E">Showing 1-12 of 48 total opportunities</text>
  <rect x="620" y="430" width="24" height="24" rx="4" fill="#21262D" />
  <text x="629" y="446" font-family="system-ui, sans-serif" font-size="10" fill="#C9D1D9">‹</text>
  <rect x="650" y="430" width="24" height="24" rx="4" fill="#238636" />
  <text x="659" y="446" font-family="system-ui, sans-serif" font-size="10" fill="#FFFFFF" font-weight="600">1</text>
  <rect x="680" y="430" width="24" height="24" rx="4" fill="#21262D" />
  <text x="689" y="446" font-family="system-ui, sans-serif" font-size="10" fill="#C9D1D9">2</text>
  <rect x="710" y="430" width="24" height="24" rx="4" fill="#21262D" />
  <text x="719" y="446" font-family="system-ui, sans-serif" font-size="10" fill="#C9D1D9">3</text>
  <rect x="740" y="430" width="24" height="24" rx="4" fill="#21262D" />
  <text x="749" y="446" font-family="system-ui, sans-serif" font-size="10" fill="#C9D1D9">›</text>
</svg>
